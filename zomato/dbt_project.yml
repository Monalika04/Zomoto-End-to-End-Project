# Name your project! Project names should contain only lowercase characters
# and underscores.
name: 'zomato'
version: '1.0.0'

# Profile used to connect to Snowflake
profile: 'zomato'

# Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Directories removed by dbt clean
clean-targets:
  - "target"
  - "dbt_packages"

# Model configuration
models:
  zomato:
    staging:
      +materialized: view
      +schema: staging

    marts:
      +materialized: table
      +schema: marts

# Snapshot configuration
snapshots:
  zomato:
    +schema: snapshots